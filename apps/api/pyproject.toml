[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "authlib>=1.7.2",
    "docker>=7.2.0",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "jwt>=1.4.0",
    "motor>=3.7.1",
    "pi-sdk[mongodb]",
    "pyjwt>=2.13.0",
    "pymongo>=4.17.0",
    "python-dotenv>=1.2.3",
    "unicorn>=2.1.4",
    "uvicorn>=0.52.4",
]

[tool.uv]
config-settings = { editable_mode = "compat" }

[tool.uv.sources]
pi-sdk = { path = "../../../pi-sdk", editable = true }
