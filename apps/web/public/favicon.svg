<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container squircle -->
  <rect width="32" height="32" rx="7.5" fill="#090d16" />
  <rect width="32" height="32" rx="7.5" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />

  <!-- Cloud Base Body -->
  <path
    d="M9.5 22.5 C6.5 22.5 4.5 20.3 4.5 17.5 C4.5 14.8 6.5 12.7 9.2 12.5 C10.1 9.3 12.8 7 16 7 C19.5 7 22.4 9.6 22.9 13.1 C25.2 13.6 27 15.5 27 17.8 C27 20.4 24.9 22.5 22.2 22.5 Z"
    fill="url(#cloudGrad)"
  />

  <!-- Internal Agent Sparkle / AI Core Accent -->
  <path
    d="M16 11.5 C16 14 17.5 15.5 20 15.5 C17.5 15.5 16 17 16 19.5 C16 17 14.5 15.5 12 15.5 C14.5 15.5 16 14 16 11.5 Z"
    fill="url(#sparkleGrad)"
    filter="url(#glow)"
  />

  <!-- Subtle accent dot -->
  <circle cx="21.5" cy="11.5" r="1" fill="#38bdf8" />
</svg>
